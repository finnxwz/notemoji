name: Release

# Only started by hand (Actions → Release → Run workflow), never by a push. Builds the
# version in manifest.json from the chosen branch, runs every check, signs where main.js,
# manifest.json and styles.css come from (artifact attestations, which the community
# directory's scorecard looks for) and creates a draft release to review and publish.
on:
  workflow_dispatch:

permissions:
  contents: write # the draft release; its tag is made when it is published
  id-token: write # signing the attestations
  attestations: write # storing them
  artifact-metadata: write # recording the release files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit: this workflow may write to the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version from manifest.json, not released yet
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "::error::$version is already released. Raise the version first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format, lint, typecheck, test and build
        run: npm run check
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "$VERSION" main.js manifest.json styles.css
          --draft --title "$VERSION" --target "$GITHUB_SHA" --generate-notes
